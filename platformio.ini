; Bathroom / bedroom ambience: one codebase, one firmware per node.
; Requirements: "Bathroom Clap Ambience – System Requirements" doc (IDs like CLAP-02 refer to it).
; Architecture:  docs/ARCHITECTURE.md      Protocols: docs/PROTOCOL.md
;
; Environments
;   native           – host unit tests for the hardware-independent modules in lib/ (run: pio test -e native)
;   bath             – bathroom node, Sonocotta Louder-ESP32-S3 Plus (+ carrier board)
;   bath_devkit      – bathroom firmware on an ESP32-S3-DevKitC-1 (bench: LEDs stand in for the outputs)
;   bedroom_speaker  – bedroom speaker node, Louder-ESP32-S3 Plus
;   bedside          – bedside node; for now on an ESP32-S3-DevKitC-1 (prototype)
;   gun, target      – alarm game nodes, ESP32-C3
;   crate            – the holy crate, Louder-ESP32-S3 Plus on a battery
;
; The node is picked by APP (see src/CMakeLists.txt): each environment passes
; -DAPP=<folder in src/app/> to CMake.

[platformio]
default_envs = bath

[env]
test_framework = unity

[env:native]
platform = native
build_type = debug
build_flags =
    -std=c11
    -Wall
    -Wextra
    -Wshadow
    -Wdouble-promotion
    -lm

[esp32s3]
platform = espressif32
framework = espidf
board = esp32-s3-devkitc-1
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
; 3 MB app partition: Wi-Fi + TLS + FAT + MP3 decoder do not fit the default 1 MB
board_build.partitions = partitions.csv
monitor_speed = 115200
test_speed = 115200
monitor_filters = esp32_exception_decoder
; If PlatformIO picks the wrong USB port, set it per environment, e.g.
; upload_port = COM5            (Windows)   /dev/ttyUSB0 (Linux)   /dev/cu.usbserial-* (macOS)
; test_port = COM5
; monitor_port = COM5

[esp32c3]
platform = espressif32
framework = espidf
board = esp32-c3-devkitm-1
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

[env:bath]
extends = esp32s3
board_build.cmake_extra_args = -DAPP=bath
build_flags =
    -DBOARD_LOUDER_S3_PLUS
; plain monitor: the exception decoder holds text back until a newline, so
; typed characters appear late. Switch back to esp32_exception_decoder to
; decode a crash dump.
monitor_filters = direct

[env:bath_devkit]
extends = esp32s3
board_build.cmake_extra_args = -DAPP=bath
build_flags =
    -DBOARD_DEVKITC1

[env:bedroom_speaker]
extends = esp32s3
board_build.cmake_extra_args = -DAPP=bedroom_speaker
build_flags =
    -DBOARD_LOUDER_S3_PLUS
monitor_filters = direct

[env:crate]
extends = esp32s3
board_build.cmake_extra_args = -DAPP=crate
build_flags =
    -DBOARD_LOUDER_S3_PLUS
monitor_filters = direct

[env:bedside]
extends = esp32s3
board_build.cmake_extra_args = -DAPP=bedside
build_flags =
    -DBOARD_DEVKITC1

[env:gun]
extends = esp32c3
board_build.cmake_extra_args = -DAPP=gun

[env:target]
extends = esp32c3
board_build.cmake_extra_args = -DAPP=target
