; Bathroom ambience controller
; Requirements: "Bathroom Clap Ambience – System Requirements" doc (IDs like CLAP-02 refer to it).
;
; Environments
;   native  – host unit tests for the hardware-independent modules in lib/ (run: pio test -e native)
;   louder  – Sonocotta Louder-ESP32-S3 Plus (target firmware)
;   devkit  – ESP32-S3-DevKitC-1 (bench prototyping: mic recorder, clap tuning)

[platformio]
default_envs = louder

[env]
test_framework = unity

[env:native]
platform = native
build_type = debug
build_flags =
    -std=c11
    -Wall
    -Wextra
    -Wshadow
    -Wdouble-promotion
    -lm

[esp32s3]
platform = espressif32
framework = espidf
board = esp32-s3-devkitc-1
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
monitor_speed = 115200
test_speed = 115200
monitor_filters = esp32_exception_decoder
; If PlatformIO picks the wrong USB port, set it per environment, e.g.
; upload_port = COM5            (Windows)   /dev/ttyUSB0 (Linux)   /dev/cu.usbserial-* (macOS)
; test_port = COM5
; monitor_port = COM5

[env:louder]
extends = esp32s3
build_flags =
    -DBOARD_LOUDER_S3_PLUS

[env:devkit]
extends = esp32s3
build_flags =
    -DBOARD_DEVKITC1
