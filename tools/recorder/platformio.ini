; Recorder firmware: streams the INMP441 to the PC for tools/capture.py.
; Open THIS folder (tools/recorder) as its own PlatformIO project, or run
;   pio run -d tools/recorder -t upload
; from the main project folder.

[env:devkit]
platform = espressif32
framework = espidf
board = esp32-s3-devkitc-1
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
monitor_speed = 921600
build_flags =
;   -DMIC_SLOT_RIGHT
; upload_port = COM5
